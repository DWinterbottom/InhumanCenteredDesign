<!DOCTYPE html>
<html>
<head>
    <title>Games For Crabs - Inhuman-Centered Design - Sign up Today!</title>
    <style>
        :root
        {
            --main-bg-color: rgb(15, 1, 28);            
            --main-text-color: rgb(241, 100, 241);
            --link-text-color: rgb(255, 141, 255);
            --link-bg-color: rgb(5, 1, 10);            
        }

        body {
            background-color: var(--main-bg-color);
            color: var(--main-text-color);
            align-content: center;
            text-align: center;
            font-weight: bold;
            font-size: x-large;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.4;
            
        }
        p {
            max-width: min(60em, 90%);
            margin:auto;
            text-align: justify;
            margin-bottom: 1ex;
        }
        p.form {
            text-align: center;
        }
        a{
            text-decoration: underline;
            font-weight: bolder;
        }
        b{
            font-weight: bolder;
        }

        a{
            padding: 3px;
            text-decoration: none;
            color: var(--link-text-color);
        }
        a.live{
            color: var(--link-text-color);
            background-color: rgb(45, 3, 84);
            border: 2px solid rgb(255, 0, 255);
            border-radius: 4px;
        }
        a.live:hover{            
            color: rgb(255, 0, 255);
            background-color: rgb(60, 2, 112);
        }
        a.opened{
            color: rgb(135, 41, 163);
            font-weight: normal;
        }
        input[type="text"]{
            color: inherit;
            border: 2px solid var(--link-text-color);
            background-color: rgb(15, 1, 28);;
            border-radius: 4px;
        }
        input[type="radio"]{
            accent-color: rgb(255, 101, 255);
            color: rgb(15, 1, 28);
        }
        table{
            margin:auto;
            margin-bottom: 1ex;
            border-radius: 4px;
        }
        th, td {
            margin: auto;
            text-align: center;
            border-collapse:collapse;
            outline: 3px solid rgb(135, 41, 163);
            padding: 3px;
            padding-left: 1em;
            padding-right: 1em;
        }
        th.day{
            background-color: rgb(60, 2, 112); ;
        }
        td.event{
            text-align: left;
            background-color: rgb(45, 3, 84);
        }        
        td.break{
            text-align: center;
        }
        li
        {
        }
    </style>
</head>
<body>
    <h1>Games For Crabs</h1>
    <h3>July 2027. Sheffield, UK</h3>
    <h2>Experimental Game Design Weekend</h2>
    <section id="introduction">
        <h3>
            The first Games for Crabs event went brilliantly.
        </h3>        
        <h3>
            I plan to run another. It is unlikely to be the same process.<br> 
            It will still focus on looking at game design via an unusual lens or focus.
        </h3>
        <h3>
            Let's see what emerges.
        </h3>
    </section>
</body>

</html>
